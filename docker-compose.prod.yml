# Production stack for this project on a shared VPS.
# Does NOT own ports 80/443 — a shared reverse proxy (deploy/edge/) does.
# `web` joins the external `proxy` network so the shared Caddy can reach it and
# auto-issue HTTPS for ${DOMAIN}; api/db stay on the private `default` network.
#
# Requires a .env file next to this one (NOT committed) with:
#   DOMAIN=books.example.com
#   POSTGRES_PASSWORD=<long random string>
#   GEMINI_API_KEY=<your key>
#   ADMIN_SECRET=<long random string>
#
# Run:  docker compose -f docker-compose.prod.yml up --build -d

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bookrag}
    volumes:
      - bookrag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookrag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookrag}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bookrag}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET in .env}
      UPLOAD_DIR: /data/uploads
    volumes:
      - bookrag_uploads:/data/uploads   # uploaded PDFs survive restarts
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Baked into the Next build; points the /api/* rewrite at the api service.
        BACKEND_ORIGIN: http://api:8000
    restart: unless-stopped
    networks:
      - default   # to reach api/db
      - proxy     # so the shared Caddy can route to it
    labels:
      # caddy-docker-proxy reads these: route ${DOMAIN} -> this container:3000,
      # auto-HTTPS included. Adding a project = just these labels, no central file.
      caddy: ${DOMAIN:?set DOMAIN in .env}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.request_body.max_size: 110MB   # allow ~100MB PDF uploads
    depends_on:
      - api

networks:
  proxy:
    external: true   # created once on the host: `docker network create proxy`
  default: {}        # private per-project network for api/db

volumes:
  bookrag_pgdata:
  bookrag_uploads:
